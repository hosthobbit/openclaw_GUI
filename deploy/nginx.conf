worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  upstream frontend_upstream {
    server frontend:80;
  }

  upstream bridge_upstream {
    server bridge:4000;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
      proxy_pass http://bridge_upstream/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
      proxy_pass http://bridge_upstream/health;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /healthz {
      proxy_pass http://bridge_upstream/healthz;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
      proxy_pass http://bridge_upstream/readyz;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ws {
      proxy_pass http://bridge_upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
